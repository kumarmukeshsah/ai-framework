# Prometheus configuration for AI Platform monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'ai-platform-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8001']
        labels:
          service: 'ai-platform'
          environment: 'production'

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']