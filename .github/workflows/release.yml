name: Release Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  quality:
    name: Full Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black mypy
      - name: Lint check
        run: ruff check product/ tests/ evaluation/
      - name: Format check
        run: black --check product/ tests/
      - name: Type check
        run: mypy product/ --ignore-missing-imports

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: |
          python -m pytest tests/unit/ tests/contract/ tests/security/ \
            -v --cov=product --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=reports/junit-all.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run E2E tests
        run: |
          python -m pytest tests/e2e/ \
            -v --junitxml=reports/junit-e2e.xml \
            --timeout=120

  benchmark:
    name: Benchmark Suite
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-benchmark
      - name: Run benchmarks
        run: |
          python -m pytest tests/performance/ \
            -v --benchmark-json=reports/benchmark-results.json \
            --benchmark-min-rounds=5 \
            --benchmark-columns=min,max,mean,stddev
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/

  evaluation:
    name: Evaluation Suite
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run golden dataset evaluation
        run: |
          python -c "
          import asyncio, sys
          from product.agents.interview_agent import InterviewAgent
          from evaluation.runners.dataset_runner import DatasetRunner
          agent = InterviewAgent()
          runner = DatasetRunner(agent, threshold=0.7)
          report = asyncio.run(runner.run_dataset('evaluation/datasets/golden_dataset.json'))
          runner.save_report(report, 'evaluation/reports/release_report.json')
          print(report.summary())
          pass_rate = report.pass_rate
          if pass_rate < 80.0:
              print(f'FAIL: Pass rate {pass_rate:.1f}% is below 80.0% threshold')
              sys.exit(1)
          print(f'PASS: Pass rate {pass_rate:.1f}% meets 80.0% threshold')
          "
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/reports/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max