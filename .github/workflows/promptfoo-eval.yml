# =============================================================================
# Promptfoo Evaluation Workflow
#
# Runs the full Promptfoo multi-track evaluation pipeline on every PR:
#   1. Install dependencies
#   2. Run Promptfoo evaluation (DeepEval + RAGAS + Custom Validators)
#   3. Run Quality Gate to check thresholds
#   4. Post results as PR comment
#   5. Fail the build if quality gate fails
# =============================================================================

name: Promptfoo Evaluation

on:
  pull_request:
    paths:
      - "product/prompts/**"
      - "product/services/prompt_service.py"
      - "tests/prompts/**"
      - "evaluation/judges/**"
      - "evaluation/metrics/**"
  push:
    branches: [main]
    paths:
      - "product/prompts/**"
      - "tests/prompts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  promptfoo-eval:
    name: "Promptfoo Multi-Track Evaluation"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Node.js dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ragas deepeval

      - name: Create results directory
        run: mkdir -p tests/prompts/results

      - name: Run Promptfoo Evaluation
        run: |
          npx promptfoo eval \
            --config tests/prompts/promptfooconfig.yaml \
            --output tests/prompts/results/eval_results.json \
            --no-cache 2>&1 | tee tests/prompts/results/eval_output.log
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use local providers if no API keys available
          PROMPTFOO_DISABLE_CACHE: "true"

      - name: Run Quality Gate
        id: quality_gate
        run: |
          python tests/prompts/quality_gate.py \
            --results tests/prompts/results/eval_results.json \
            --threshold 0.8 \
            --format json \
            --output tests/prompts/results/quality_gate_result.json
        continue-on-error: true

      - name: Generate PR Comment
        if: github.event_name == 'pull_request'
        run: |
          python tests/prompts/quality_gate.py \
            --results tests/prompts/results/eval_results.json \
            --threshold 0.8 \
            --format pr-comment \
            --output tests/prompts/results/pr_comment.md

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync(
              'tests/prompts/results/pr_comment.md',
              'utf8'
            );
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: |
            tests/prompts/results/
          retention-days: 30

      - name: Fail on Quality Gate
        if: steps.quality_gate.outcome == 'failure'
        run: |
          echo "❌ Quality Gate FAILED. Review the PR comment for details."
          exit 1

      - name: Run Red Teaming (Nightly only)
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          npx promptfoo redteam \
            --config tests/prompts/redteam/redteam_config.yaml \
            --output tests/prompts/results/redteam_results.json 2>&1 | \
            tee tests/prompts/results/redteam_output.log